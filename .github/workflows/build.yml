name: Build IPA
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish releases

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for t in tests/*.test.js; do node "$t" || exit 1; done
      - run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        # Version 1.0.<run number> so SideStore sees every build as an update.
        run: |
          xcodebuild -project USBrowser.xcodeproj -target USBrowser -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.0.$GITHUB_RUN_NUMBER CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/USBrowser.app Payload/
          zip -qr PB.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PB-ipa
          path: PB.ipa
      - name: Publish release + SideStore source
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/make-source.js "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" PB.ipa > source.json
          gh release create "build-$GITHUB_RUN_NUMBER" PB.ipa source.json \
            --title "PB 1.0.$GITHUB_RUN_NUMBER" --notes "$(git log -1 --format=%s)" --latest
