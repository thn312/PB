name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/spoof.test.js
      - run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project USBrowser.xcodeproj -target USBrowser -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/USBrowser.app Payload/
          zip -qr PB-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PB-ipa
          path: PB-unsigned.ipa
