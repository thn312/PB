name: Build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish releases

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for t in tests/*.test.js; do node "$t" || exit 1; done
      - run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        # Version 1.0.<run number> so SideStore sees every build as an update.
        run: |
          xcodebuild -project USBrowser.xcodeproj -target USBrowser -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.0.$GITHUB_RUN_NUMBER CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/USBrowser.app Payload/
          zip -qr PB.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PB-ipa
          path: PB.ipa

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Test + build APK
        working-directory: android
        env:
          PB_KEYSTORE_B64: ${{ secrets.PB_KEYSTORE_B64 }}
          PB_KEYSTORE_PASSWORD: ${{ secrets.PB_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$PB_KEYSTORE_B64" ]; then
            echo "$PB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pb.keystore"
            export PB_KEYSTORE="$RUNNER_TEMP/pb.keystore"
          else
            echo "::warning::No PB_KEYSTORE_B64 secret: this APK uses a throwaway key and can't update over a previous install."
          fi
          gradle testReleaseUnitTest assembleRelease -PbuildNumber=$GITHUB_RUN_NUMBER --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../PB.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PB-apk
          path: PB.apk

  release:
    needs: [ios, android]
    # Publish even if only one platform built, so a broken Android build never blocks iOS updates (or vice versa).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish release + SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=""
          if [ -f dist/PB.ipa ]; then
            node tools/make-source.js "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" dist/PB.ipa > source.json
            files="dist/PB.ipa source.json"
          fi
          [ -f dist/PB.apk ] && files="$files dist/PB.apk"
          # Only a release with source.json may become "latest": SideStore reads releases/latest/download/source.json.
          latest=false; [ -f source.json ] && latest=true
          gh release create "build-$GITHUB_RUN_NUMBER" $files \
            --title "PB 1.0.$GITHUB_RUN_NUMBER" --notes "$(git log -1 --format=%s)" --latest=$latest
